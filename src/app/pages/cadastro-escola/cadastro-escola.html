<div class="cadastro-page">

  <header class="top-header">

    <div class="brand" (click)="voltar()">

      <div class="brand-icon">
        🚌
      </div>

      <div class="brand-text">
        <strong>Transporte Digital</strong>
        <span>Transporte escolar inteligente</span>
      </div>

    </div>

  </header>


  <main class="cadastro-container">

    <section class="cadastro-card">

      <div class="main-icon">
        🏫
      </div>

      <h1>Cadastro da Escola</h1>

      <p class="subtitle">
        Preencha os dados da escola para criar sua conta.
      </p>


      <form (submit)="cadastrar()">

        <!-- Nome da escola -->

        <div class="form-group">

          <label>Nome da escola</label>

          <input
            type="text"
            placeholder="Digite o nome da escola"
            required>

        </div>


        <!-- CPF -->

        <div class="form-group">

          <label>CPF do responsável</label>

          <input
            type="text"
            placeholder="Digite o CPF do responsável"
            required>

        </div>


        <!-- Código da escola -->

        <div class="form-group">

          <label>Código da escola</label>

          <input
            type="text"
            placeholder="Digite o código da escola"
            required>

        </div>


        <!-- E-mail -->

        <div class="form-group">

          <label>E-mail</label>

          <input
            type="email"
            placeholder="Digite o e-mail da escola"
            required>

        </div>


        <!-- Senha -->

        <div class="form-group">

          <label>Senha</label>

          <input
            type="password"
            placeholder="Crie uma senha"
            required>

        </div>


        <!-- Confirmar senha -->

        <div class="form-group">

          <label>Confirmar senha</label>

          <input
            type="password"
            placeholder="Digite a senha novamente"
            required>

        </div>


        <button
          type="submit"
          class="btn-cadastrar">

          Criar conta

        </button>

      </form>


      <button
        class="btn-voltar"
        (click)="voltar()">

        ← Voltar

      </button>

    </section>

  </main>

</div>
