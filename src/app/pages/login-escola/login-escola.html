<div class="login-page">

  <header class="top-header">

    <div class="brand" (click)="voltar()">
      <div class="brand-icon">
        🚌
      </div>

      <div class="brand-text">
        <strong>Transporte Digital</strong>
        <span>Transporte escolar inteligente</span>
      </div>
    </div>

    <button class="help-button">
      Ajuda?
    </button>

  </header>


  <main class="login-content">

    <section class="login-card">

      <div class="main-icon">
        🏫
      </div>

      <h1>Login da Escola</h1>

      <p class="subtitle">
        Entre para gerenciar as informações do transporte escolar.
      </p>


      <form>

        <div class="form-group">

          <label for="codigo">
            Código da escola
          </label>

          <input
            id="codigo"
            type="text"
            placeholder="Digite o código da escola"
          >

        </div>


        <div class="form-group">

          <label for="email">
            E-mail
          </label>

          <input
            id="email"
            type="email"
            placeholder="Digite seu e-mail"
          >

        </div>


        <div class="form-group">

          <label for="senha">
            Senha
          </label>

          <input
            id="senha"
            type="password"
            placeholder="Digite sua senha"
          >

        </div>


        <button
          type="button"
          class="login-button"
          (click)="entrar()">

          Entrar

        </button>

      </form>


      <div class="register-section">

        <p>
          Ainda não possui uma conta?
        </p>

        <button
          class="register-button"
          (click)="criarConta()">

          Criar conta

        </button>

      </div>


      <button
        class="back-button"
        (click)="voltar()">

        ← Voltar para seleção de perfil

      </button>

    </section>

  </main>

</div>
