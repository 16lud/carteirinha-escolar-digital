<div class="cadastro-page">

  <header class="top-header">

    <div class="brand" (click)="voltar()">
      <div class="brand-icon">
        🚌
      </div>

      <div class="brand-text">
        <strong>Transporte Digital</strong>
        <span>Transporte escolar inteligente</span>
      </div>
    </div>

    <button class="help-button">
      Ajuda?
    </button>

  </header>


  <main class="cadastro-content">

    <section class="cadastro-card">

      <div class="main-icon">
        👨‍🎓
      </div>

      <h1>Cadastro do Aluno</h1>

      <p class="subtitle">
        Preencha seus dados para criar sua conta.
      </p>


      <!-- MENSAGEM DE SUCESSO -->

      @if (cadastroConcluido) {

        <div class="success-message">
          <div class="success-icon">✓</div>

          <h2>Cadastro concluído!</h2>

          <p>
            Sua conta foi criada com sucesso.
          </p>

          <span>
            Redirecionando para o dashboard...
          </span>
        </div>

      } @else {

        <!-- FORMULÁRIO -->

        <form (submit)="criarConta(); $event.preventDefault()">

          <div class="form-group">
            <label for="nome">Nome completo</label>

            <input
              id="nome"
              type="text"
              placeholder="Digite seu nome completo"
              required>
          </div>


          <div class="form-group">
            <label for="matricula">Matrícula</label>

            <input
              id="matricula"
              type="text"
              placeholder="Digite sua matrícula"
              required>
          </div>


          <div class="form-row">

            <div class="form-group">
              <label for="turma">Turma</label>

              <input
                id="turma"
                type="text"
                placeholder="Ex.: 3INFO"
                required>
            </div>


            <div class="form-group">
              <label for="turno">Turno</label>

              <select id="turno" required>

                <option value="">
                  Selecione
                </option>

                <option value="manha">
                  Manhã
                </option>

                <option value="tarde">
                  Tarde
                </option>

                <option value="noite">
                  Noite
                </option>

              </select>

            </div>

          </div>


          <div class="form-group">
            <label for="email">E-mail</label>

            <input
              id="email"
              type="email"
              placeholder="Digite seu e-mail"
              required>
          </div>


          <div class="form-group">
            <label for="senha">Criar senha</label>

            <input
              id="senha"
              type="password"
              placeholder="Crie uma senha"
              required>
          </div>


          <button
            type="submit"
            class="btn-primary">

            Criar conta

          </button>

        </form>


        <button
          class="back-button"
          (click)="voltar()">

          ← Voltar para escolha de perfil

        </button>

      }

    </section>

  </main>

</div>
